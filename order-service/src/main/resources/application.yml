server:
  port: 8082

spring:
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: order-service
  cloud:
    config:
      fail-fast: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
